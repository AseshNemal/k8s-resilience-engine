name: resilience-engine

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resilience_engine}
      POSTGRES_USER: ${POSTGRES_USER:-resilience}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-resilience}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-resilience_engine}
      KUBECONFIG: /run/kube/config
      WORKFLOW_JAEGER_ALLOWED_HOSTS: ${WORKFLOW_JAEGER_ALLOWED_HOSTS:-localhost,127.0.0.1,::1,jaeger}
    ports:
      # Loopback only: the app has no authentication.
      - "127.0.0.1:8000:8000"
    volumes:
      # Dedicated kind kubeconfig written by scripts/cluster-up.sh. The entrypoint copies
      # it into the tmpfs below for the unprivileged app user. Never create it implicitly.
      - type: bind
        source: ./.kube/kind-internal.config
        target: /run/secrets/kubeconfig
        read_only: true
        bind:
          create_host_path: false
      - type: tmpfs
        target: /run/kube
        tmpfs:
          size: 1048576
          mode: 0700
    networks:
      - default
      - kind
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

networks:
  # Created by kind (scripts/cluster-up.sh); lets the app reach the cluster API server.
  kind:
    external: true

volumes:
  pgdata:
