# Full access to the connected research cluster for the Resilience Engine extension (developer-approved
# 2026-10-23: applying an approved change and resetting it need to write). Applied only by
# `scripts/extension-cluster-access.sh` or the extension's Connect page, after confirmation.
# The file keeps its old name and the objects keep the `-reader` name so an existing install upgrades in place.
# The engine still writes only through its approval and application gates, never on its own.
apiVersion: v1
kind: Namespace
metadata:
  name: resilience-engine
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: resilience-engine-reader
  namespace: resilience-engine
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: resilience-engine-reader
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: resilience-engine-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: resilience-engine-reader
subjects:
  - kind: ServiceAccount
    name: resilience-engine-reader
    namespace: resilience-engine
