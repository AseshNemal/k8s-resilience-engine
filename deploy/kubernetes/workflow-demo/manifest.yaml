    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adservice
  namespace: resilience-workflow-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adservice
  template:
    metadata:
      labels:
        app: adservice
        app.kubernetes.io/part-of: resilience-workflow-demo
      annotations:
        resilience-research/image-id: sha256:d1af734def2476ca909d43cb7340d92010ecd79a57d13fd6fc07115588270a94
    spec:
      automountServiceAccountToken: false
      containers:
      - name: adservice
        image: k8s-resilience/adservice-otel:v0.10.1
        imagePullPolicy: Never
        env:
        - name: COLLECTOR_SERVICE_ADDR
          value: jaeger:4317
        - name: DISABLE_PROFILER
          value: '1'
        - name: ENABLE_TRACING
          value: '1'
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://jaeger:4317
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: grpc
        - name: OTEL_LOGS_EXPORTER
          value: none
        - name: OTEL_METRICS_EXPORTER
          value: none
        - name: OTEL_PROPAGATORS
          value: tracecontext,baggage
        - name: OTEL_SERVICE_NAME
          value: adservice
        - name: OTEL_TRACES_EXPORTER
          value: otlp
        - name: PORT
          value: '9555'
        ports:
        - containerPort: 9555
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
            ephemeral-storage: 128Mi
          limits:
            cpu: 1000m
            memory: 768Mi
            ephemeral-storage: 1Gi
        readinessProbe:
          tcpSocket:
            port: 9555
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: adservice
  namespace: resilience-workflow-demo
spec:
  selector:
    app: adservice
  ports:
  - name: tcp-9555
    port: 9555
    targetPort: 9555
---
