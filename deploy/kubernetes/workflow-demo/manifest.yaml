apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: resilience-workflow-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
        app.kubernetes.io/part-of: resilience-workflow-demo
      annotations:
        resilience-research/image-id: sha256:854fc203f0ccc39e2bee2f340fdf3c58961fa3dd798bafb670e4125f4257dcf8
    spec:
      automountServiceAccountToken: false
      containers:
      - name: jaeger
        image: jaegertracing/all-in-one:1.56
        imagePullPolicy: Never
        env:
        - name: COLLECTOR_OTLP_ENABLED
          value: 'true'
        - name: SPAN_STORAGE_TYPE
          value: badger
        - name: BADGER_EPHEMERAL
          value: 'false'
        - name: BADGER_DIRECTORY_VALUE
          value: /badger/data
        - name: BADGER_DIRECTORY_KEY
          value: /badger/key
        ports:
        - containerPort: 16686
        - containerPort: 4317
        - containerPort: 4318
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
            ephemeral-storage: 128Mi
          limits:
            cpu: 1000m
            memory: 512Mi
            ephemeral-storage: 1Gi
        readinessProbe:
          tcpSocket:
            port: 16686
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: traces
          mountPath: /badger
      volumes:
      - name: traces
        persistentVolumeClaim:
          claimName: jaeger-traces
      securityContext:
        fsGroup: 10001
  strategy:
    type: Recreate
---
apiVersion: v1
